name: Build L4T base image

on:
  workflow_dispatch:
    inputs:
      version:
        description: Image tag (e.g. 0.0.1)
        required: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-22.04-arm
    steps:
      # actions/checkout@v6.0.2
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: etc/Dockerfile.zed-base-l4t
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/viam-labs/zed/viam-cpp-base-l4t:${{ inputs.version }}
            ghcr.io/viam-labs/zed/viam-cpp-base-l4t:latest
