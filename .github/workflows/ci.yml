name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      # actions/checkout@v6.0.2
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      # Skips the ~2h Conan rebuild of viam-cpp-sdk on cache hit.
      - name: Cache Conan packages
        uses: actions/cache@v4
        with:
          path: ~/.conan2
          key: conan-${{ runner.os }}-${{ hashFiles('conanfile.py') }}
          restore-keys: |
            conan-${{ runner.os }}-

      # Restores CUDA + ZED SDK. Skips ~5 min of Setup on cache hit; bin/setup.sh
      # detects existing installs and short-circuits. Bump -v1 to invalidate.
      - name: Restore system cache
        id: system-cache
        uses: actions/cache/restore@v4
        with:
          path: /tmp/system-cache.tgz
          key: system-cuda12.6-zed5.0-${{ runner.os }}-v1

      - name: Extract system cache
        if: steps.system-cache.outputs.cache-hit == 'true'
        run: sudo tar xzf /tmp/system-cache.tgz -C /

      - name: Setup
        run: make setup

      - name: Pack system cache
        if: steps.system-cache.outputs.cache-hit != 'true'
        run: |
          sudo tar czf /tmp/system-cache.tgz \
            /usr/local/cuda-12.6 \
            /usr/local/zed \
            /usr/lib/x86_64-linux-gnu/libnvidia-*.so* \
            /usr/lib/x86_64-linux-gnu/libnvcuvid.so* \
            /usr/lib/x86_64-linux-gnu/libcuda.so*

      - name: Save system cache
        if: steps.system-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /tmp/system-cache.tgz
          key: system-cuda12.6-zed5.0-${{ runner.os }}-v1

      - name: Build module.tar.gz
        run: make module.tar.gz

      - name: Verify build artifact
        run: |
          test -f module.tar.gz
          tar tzf module.tar.gz | sort

  lint:
    runs-on: ubuntu-22.04
    steps:
      # actions/checkout@v6.0.2
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Install clang-format-19
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/llvm.asc >/dev/null
          echo "deb http://apt.llvm.org/jammy/ llvm-toolchain-jammy-19 main" | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update
          sudo apt-get install -y clang-format-19

      - name: Run linter
        run: ./bin/lint.sh

      - name: Verify no formatting drift
        run: git diff --exit-code
