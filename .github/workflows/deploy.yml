name: Deploy module

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Version tag (e.g. v0.0.1)
        required: true

permissions:
  contents: read
  packages: read

env:
  MODULE_VERSION: ${{ inputs.version || github.ref_name }}

jobs:
  build-amd64:
    runs-on: ubuntu-22.04
    steps:
      # actions/checkout@v6.0.2
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Cache Conan packages
        uses: actions/cache@v4
        with:
          path: ~/.conan2
          key: conan-Linux-linux/amd64-${{ hashFiles('conanfile.py') }}
          restore-keys: |
            conan-Linux-linux/amd64-

      - name: Setup
        run: make setup

      - name: Build module.tar.gz
        run: make module.tar.gz

      - name: Verify build artifact
        run: |
          test -f module.tar.gz
          tar tzf module.tar.gz | sort

      - name: Upload module artifact
        uses: actions/upload-artifact@v4
        with:
          name: module-linux-amd64
          path: module.tar.gz

  build-arm64:
    runs-on: ubuntu-22.04-arm
    container:
      image: ghcr.io/viam-labs/zed/viam-cpp-base-l4t:0.0.1
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      # actions/checkout@v6.0.2
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Cache Conan packages
        uses: actions/cache@v4
        with:
          path: ~/.conan2
          key: conan-Linux-linux/arm64-${{ hashFiles('conanfile.py') }}
          restore-keys: |
            conan-Linux-linux/arm64-

      - name: Setup
        run: make setup

      - name: Build module.tar.gz
        run: make module.tar.gz

      - name: Verify build artifact
        run: |
          test -f module.tar.gz
          tar tzf module.tar.gz | sort

      - name: Upload module artifact
        uses: actions/upload-artifact@v4
        with:
          name: module-linux-arm64
          path: module.tar.gz

  publish:
    needs: [build-amd64, build-arm64]
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            artifact-name: module-linux-amd64
          - platform: linux/arm64
            artifact-name: module-linux-arm64
    steps:
      # actions/checkout@v6.0.2
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Download module artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: ./artifact

      - name: Upload to Viam registry
        uses: viamrobotics/upload-module@v1
        with:
          meta-path: meta.json
          module-path: ./artifact/module.tar.gz
          platform: ${{ matrix.platform }}
          version: ${{ env.MODULE_VERSION }}
          key-id: ${{ secrets.VIAM_KEY_ID }}
          key-value: ${{ secrets.VIAM_KEY_SECRET }}
